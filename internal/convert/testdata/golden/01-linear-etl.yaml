apiVersion: eventboat/v3
kind: Pipeline
metadata: {name: linear-etl}
limits:
  max_in_flight: 1000
sources:
  cron-source:
    decoder: json
    cron:
      expression: '*/5 * * * *'
      payload: '{"price":10,"quantity":5,"sku":"A-001"}'
transforms:
  enrich:
    from: cron-source
    workers: 2
    script: |-
      payload.total = payload.price * payload.quantity
      meta.enriched_at = "riverpod"
sinks:
  drop-sink:
    from:
      enrich:
        when: payload.total > 20
    drop: {}
