apiVersion: eventboat/v3
kind: Pipeline
metadata: {name: fan-in}
sources:
  events-source:
    decoder: json
    cron:
      expression: '*/3 * * * *'
      payload: '{"stream":"events","event_type":"page_view","user_id":"u-9"}'
  orders-source:
    decoder: json
    cron:
      expression: '*/2 * * * *'
      payload: '{"stream":"orders","order_id":"O-1001","amount":50}'
transforms:
  merge:
    from:
      - events-source
      - orders-source
    script: |-
      payload.processed = True
      meta.source_stream = payload.stream
sinks:
  drop-sink:
    from: merge
    drop: {}
