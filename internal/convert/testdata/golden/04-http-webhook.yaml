apiVersion: eventboat/v3
kind: Pipeline
metadata: {name: http-webhook}
sources:
  webhook-in:
    decoder: json
    http_server:
      listen: :8080
      path: /events
transforms:
  enrich:
    from: webhook-in
    script: |-
      meta.received_via = "webhook"
      payload.received = True
sinks:
  http-out:
    from: enrich
    encoder: json
    http:
      url: ${WEBHOOK_TARGET_URL}
