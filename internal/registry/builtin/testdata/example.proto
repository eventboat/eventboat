// Human-readable mirror of the protobuf codec's test fixture.
// The committed example.descr is generated by descr_test.go's Go generator
// (the source of truth — CI has no protoc); keep the two in sync when
// changing the fixture.
syntax = "proto3";

package eventboat.example;

message Metric {
  string name = 1;
  int64 value = 2;
  repeated string tags = 3;
}
