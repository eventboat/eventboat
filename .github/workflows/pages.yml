# GitHub Pages deploy for the Eventboat documentation site.
#
# The site is generated by tools/sitegen (a separate Go module — the generator
# must run inside that module, hence the working-directory/-src flags below)
# into a flat, relative-URL tree that works under the project subpath
# https://eventboat.github.io/eventboat/.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "tools/sitegen/**"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # cache-dependency-path pins the cache to the nested module's go.sum;
      # setup-go itself runs at the repo root, so the download below uses
      # `go -C` to enter tools/sitegen.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: tools/sitegen/go.mod

      - name: Download generator dependencies (nested module)
        run: go -C tools/sitegen mod download

      - name: Generate site
        working-directory: tools/sitegen
        run: go run . -src "${{ github.workspace }}" -out "${{ github.workspace }}/site-public"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-public

      - id: deployment
        uses: actions/deploy-pages@v4
