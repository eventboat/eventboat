name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23" # matches go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Includes the seven TestInvariant_* reliability tests and the
      # examples verify/test acceptance gate (cmd/eventboat/examples_test.go).
      - name: Test (race)
        run: go test -race ./...
