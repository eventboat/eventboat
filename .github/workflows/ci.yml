name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25" # matches go.mod (the 1.23 pin predated the 1.25 bump)
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Rebuild the WASM guest from source and run the wasm tests against the
      # fresh artifact (committed .wasm files exist so local `go test` works
      # without a toolchain dance; CI proves the source matches reality).
      # Same discipline for the protobuf codec's committed descriptor set.
      - name: Build WASM guest
        run: |
          cd internal/wasmhost/testdata/guest
          GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o ../aggregate.wasm .

      - name: Rebuild protobuf descriptor set
        run: |
          cd internal/registry/builtin/testdata
          protoc --descriptor_set_out=example.descr example.proto
          git diff --exit-code -- example.descr || (echo "example.descr drifted from example.proto" && exit 1)

      # Includes the seven TestInvariant_* reliability tests, the examples
      # verify/test acceptance gate (cmd/eventboat/examples_test.go), the
      # third-party gRPC plugin acceptance (internal/rpcplugin), the CESQL
      # TCK (internal/lang/cesqlhost) and the WASM tier tests.
      - name: Test (race)
        run: go test -race ./...
        env:
          EVENTBOAT_WASM_GUEST: ${{ github.workspace }}/internal/wasmhost/testdata/aggregate.wasm

  # Optional benchmark job (M3 §4.6 discipline: reproducible numbers, not a
  # regression gate — absolute numbers are machine-dependent). Results appear
  # in the job log; the README records a reference machine's numbers.
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build WASM guest
        run: |
          cd internal/wasmhost/testdata/guest
          GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o ../aggregate.wasm .
      - name: Benchmarks (CEL predicate, Starlark scripts, Starlark vs WASM)
        run: go test -bench . -benchtime 1s -run XXX ./internal/lang/... ./internal/wasmhost/...
        env:
          EVENTBOAT_WASM_GUEST: ${{ github.workspace }}/internal/wasmhost/testdata/aggregate.wasm
