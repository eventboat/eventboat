apiVersion: eventboat/v1
kind: Pipeline
metadata: { name: custom-build-demo }

sources:
  ingest:
    decoder: json
    file:
      path: input/orders.jsonl

sinks:
  echoed:
    depends_on: [ingest]
    encoder: json
    batch: {size: 10, timeout_ms: 200}
    myecho:
      path: output/echoed.out.jsonl
