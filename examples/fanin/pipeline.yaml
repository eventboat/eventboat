apiVersion: eventboat/v1
kind: Pipeline
metadata: { name: audit-fan-in }

constants:
  system: audit-fan-in

sources:
  orders:
    decoder: json
    file:
      path: input/orders.jsonl
      on_eof: stop
  refunds:
    decoder: json
    file:
      path: input/refunds.jsonl
      on_eof: stop

transforms:
  stamp:
    depends_on: [orders, refunds]
    script: |
      meta.stream = meta.source
      payload.seen_by = constants.system

sinks:
  audit:
    depends_on: [stamp]
    encoder: json
    # One write per batch: the collection shape (verify's
    # lint_collector_batch_one warns when a file-sourced pipeline leaves the
    # effective batch.size at 1).
    batch: { size: 10, timeout_ms: 200 }
    file:
      path: output/audit.jsonl
