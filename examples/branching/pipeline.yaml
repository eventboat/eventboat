apiVersion: eventboat/v3
kind: Pipeline
metadata: { name: order-branching }

constants:
  vip_threshold: 10000

sources:
  ingest:
    decoder: json
    file:
      path: input/events.jsonl

transforms:
  enrich:
    from: [ingest]
    script: |
      payload.total = payload.price * payload.qty
      if payload.total > constants.vip_threshold:
          meta.tier = "vip"
      else:
          meta.tier = "basic"

sinks:
  eu-out:
    from: { enrich: { when: 'payload.region == "eu"' } }
    encoder: json
    file:
      path: output/eu.jsonl
  us-out:
    from: { enrich: { when: 'payload.region == "us"' } }
    encoder: json
    file:
      path: output/us.jsonl
